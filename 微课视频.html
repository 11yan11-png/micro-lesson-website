<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>微课视频 - 植物园 · 微课拓展学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Comic Sans MS', sans-serif;
        }

        :root {
            --primary: #7CB342;          
            --primary-dark: #2C5F2D;     
            --light: #FFF8E1;            
            --yellow: #FFC107;          
            --text: #424242;            
            --white: #FFFFFF;            
            --shadow: rgba(124, 179, 66, 0.15); 
        }

        body {
            background-color: var(--light);
            color: var(--text);
            line-height: 1.8;
            padding: 20px 0;
            /* 新增：预留页脚空间，避免内容被遮挡 */
            margin-bottom: 80px;
        }

        header {
            background: var(--primary);
            padding: 15px 50px;
            color: var(--white);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            color: var(--white);
            text-decoration: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            color: var(--yellow);
            text-decoration: underline;
        }

        .video-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 25px;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 40px;
            font-weight: bold;
        }

        .video-card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px var(--shadow);
            border: 2px solid var(--primary);
            margin-bottom: 35px;
            text-align: center;
        }
        .video-card:hover {
            border-color: var(--yellow);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .card-header {
            margin-bottom: 30px;
        }
        .video-icon {
            font-size: 60px;
            color: #7952B3; 
            margin-bottom: 15px;
        }
        .card-header h4 {
            font-size: 28px;
            color: var(--primary); 
            margin-bottom: 10px;
        }
        .card-header p {
            font-size: 18px;
            color: var(--text);
            max-width: 80%;
            margin: 0 auto;
        }

        .video-btn-box {
            text-align: center;
            margin: 25px 0;
        }
        .video-btn {
            background: var(--yellow);
            color: #333;
            padding: 15px 45px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: none;
            cursor: pointer;
        }
        .video-btn:hover {
            background: #FFA000;
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .video-player {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #000; 
        }

        /* 新增：和截图一致的页脚样式 */
        footer {
            background: var(--primary); /* 匹配截图的绿色背景 */
            color: var(--white);        /* 白色文字 */
            text-align: center;         /* 文字居中 */
            padding: 30px;              /* 内边距匹配截图 */
            font-size: 18px;            /* 字体大小匹配截图 */
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1); /* 底部阴影增加层次感 */
            /* 固定在页面底部，不随滚动条移动 */
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .video-player { height: 400px; }
            .card-header h4 { font-size: 24px; }
            .video-btn { padding: 12px 35px; font-size: 20px; }
            /* 移动端页脚适配 */
            footer { padding: 20px; font-size: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-box">
        <div class="logo">🌱 植物园</div>
        <a href="index.html" class="back-btn">← 返回首页</a>
    </div>
</header>

<div class="video-container">
    <h2 class="main-title">微课视频学习中心</h2>

    <div class="video-card">
        <div class="card-header">
            <div class="video-icon">🎥</div>
            <h4>微课视频</h4>
            <p>高清动画微课视频，随时随地反复观看学习</p>
        </div>

        <div class="video-btn-box">
            <a href="#video-player" class="video-btn">立即观看</a>
        </div>

        <video id="video-player" class="video-player" controls autoplay muted>
            <source src="微课视频.mp4" type="video/mp4">
            你的浏览器不支持视频播放，请下载视频文件查看：
            <a href="微课视频.mp4" download>下载微课视频</a>
        </video>
    </div>
</div>

<!-- 新增：和截图一致的页脚 -->
<footer>
    <p>© 2026 植物园 · 微课拓展学习平台</p>
</footer>

</body>
</html>
